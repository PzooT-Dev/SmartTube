name: Modern UI + Remote API integration probe

on:
  push:
    branches:
      - modern-remote-integration
    paths:
      - '.github/workflows/integration-modern-remote.yml'
  pull_request:
    branches:
      - akver
    paths:
      - '.github/workflows/integration-modern-remote.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-ui:
    name: Stage A - current upstream + PR 6334
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Fetch upstream and PR 6334
        run: |
          git remote add upstream https://github.com/yuliskov/SmartTube.git || true
          git fetch upstream master pull/6334/head:pr-6334
          git checkout --detach upstream/master
          git submodule update --init --recursive
      - name: Apply PR 6334 and capture conflicts
        id: modern_merge
        shell: bash
        run: |
          set +e
          git config user.name github-actions
          git config user.email github-actions@github.com
          git cherry-pick 9adaa83b5517ee912c164e015b7429569f0078c2
          rc=$?
          if [ $rc -ne 0 ]; then
            echo '### PR #6334 conflicts' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git status --short >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U | tee modern-conflicts.txt
            git diff --cc > modern-conflict.diff
            echo 'clean=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'clean=true' >> "$GITHUB_OUTPUT"
          echo '### PR #6334 applies cleanly to current upstream master' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PR 6334 conflict diagnostics
        if: steps.modern_merge.outputs.clean != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-6334-conflicts
          path: |
            modern-conflicts.txt
            modern-conflict.diff
          if-no-files-found: warn
      - name: Build PR 6334 on current upstream
        if: steps.modern_merge.outputs.clean == 'true'
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStstableDebug
      - name: Upload modern UI universal APK
        if: steps.modern_merge.outputs.clean == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-current-plus-6334
          path: smarttubetv/build/outputs/apk/ststable/debug/*_universal.apk
          if-no-files-found: error

  remote-api:
    name: Stage B probe - current upstream + PR 5896
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Fetch upstream and PR 5896
        run: |
          git remote add upstream https://github.com/yuliskov/SmartTube.git || true
          git fetch upstream master pull/5896/head:pr-5896
          git checkout --detach upstream/master
      - name: Probe PR 5896 merge and capture conflicts
        id: remote_merge
        shell: bash
        run: |
          set +e
          git config user.name github-actions
          git config user.email github-actions@github.com
          git merge --no-ff --no-commit pr-5896
          rc=$?
          if [ $rc -ne 0 ]; then
            echo '### PR #5896 conflicts' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git status --short >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U | tee remote-conflicts.txt
            git diff --cc > remote-conflict.diff
            echo 'clean=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'clean=true' >> "$GITHUB_OUTPUT"
          echo '### PR #5896 merges cleanly to current upstream master' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PR 5896 conflict diagnostics
        if: steps.remote_merge.outputs.clean != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-5896-conflicts
          path: |
            remote-conflicts.txt
            remote-conflict.diff
          if-no-files-found: warn
